services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wtd
      POSTGRES_PASSWORD: wtd
      POSTGRES_DB: wtd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtd -d wtd"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
