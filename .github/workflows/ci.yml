name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wtd
          POSTGRES_PASSWORD: wtd
          POSTGRES_DB: wtd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wtd -d wtd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wtd:wtd@localhost:5432/wtd
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @wtd/server migrate

      - run: pnpm --filter @wtd/server seed

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build
